# ========================================================
# Smart Campus Cloud Management System - Spring Boot Properties
# ========================================================

spring.application.name=smart-campus-cloud
server.port=${SERVER_PORT:8080}

# MySQL Database DataSource Configuration with Environment Variable Support
spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:smart_campus_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:rootpassword}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# JWT Security Configuration
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-milliseconds=${JWT_EXPIRATION_MS:900000}

# Per-IP login rate limit (10 attempts per 5 minutes by default)
app.security.login.max-attempts=${LOGIN_MAX_ATTEMPTS:10}
app.security.login.window-milliseconds=${LOGIN_WINDOW_MS:300000}

# H2 Console (For Dev Profile)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Logging
logging.level.com.smartcampus=INFO
logging.level.org.springframework.security=WARN
